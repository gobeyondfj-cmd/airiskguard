[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airiskguard"
dynamic = ["version"]
description = "AI Risk Governance Framework — model registry, audit logs, risk dashboards, anomaly detection, regulatory reports, and human review workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "airiskguard contributors" },
]
keywords = ["ai", "risk", "governance", "audit", "compliance", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "pyyaml>=6.0",
    "aiosqlite>=0.17",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.20",
    "torch>=1.12",
]
fastapi = [
    "fastapi>=0.68",
    "uvicorn>=0.15",
]
flask = [
    "flask>=2.0",
]
postgres = [
    "asyncpg>=0.27",
]
redis = [
    "redis[asyncio]>=5.0",
]
langchain = [
    "langchain-core>=0.1",
]
llamaindex = [
    "llama-index-core>=0.10",
]
openai = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "httpx>=0.24",
]
all = [
    "airiskguard[transformers,fastapi,flask,postgres,redis,langchain,llamaindex,openai,dev]",
]

[project.scripts]
airiskguard-benchmark = "airiskguard.benchmark.cli:main"

[tool.hatch.version]
path = "src/airiskguard/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/airiskguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
